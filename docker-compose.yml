version: '3.8'

services:
  frontend:
    image: ${DOCKER_USERNAME}/terabox-frontend:latest
    ports:
      - "8081:80"
    restart: always
    depends_on:
      - backend

  backend:
    image: ${DOCKER_USERNAME}/terabox-backend:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
